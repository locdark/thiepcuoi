<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới: Hoài Phước & Diệu Hồng</title>
  <script>
    // SPA Router for GitHub Pages to support clean URLs like /Phuochongmoiaido
    var pathSegmentsToKeep = 0;
    var l = window.location;
    var cleanSearch = l.search ? l.search.slice(1).replace(/^(?:q=)+/, '').replace(/&(?:q=)+/g, '&') : '';
    var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (cleanSearch ? '&q=' + cleanSearch.replace(/&/g, '~and~') : '') +
      l.hash;
    l.replace(redirectUrl);
  </script>
</head>
<body style="background:#240508;color:#fde68a;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Đang mở thiệp cưới...</p>
</body>
</html>
